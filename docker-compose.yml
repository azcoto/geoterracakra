name: geoterracakra

services:
  postgis:
    image: kartoza/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geoterracakra}
      POSTGRES_USER: ${POSTGRES_USER:-geoterracakra}
      POSTGRES_PASS: ${POSTGRES_PASS:-geoterracakra}
      POSTGRES_MULTIPLE_EXTENSIONS: postgis
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./data/postgis:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:1.13.0
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoterracakra}:${POSTGRES_PASS:-geoterracakra}@postgis:5432/${POSTGRES_DB:-geoterracakra}
    ports:
      - "${MARTIN_PORT:-3001}:3000"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped
